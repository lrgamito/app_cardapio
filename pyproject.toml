[project]
name = "cardapio"
version = "0.1.0"
description = "App de Cardápio Semanal - Gerencia receitas e gera cardápio semanal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cardapio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]
ignore = []